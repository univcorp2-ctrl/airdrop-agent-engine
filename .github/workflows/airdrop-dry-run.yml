name: Airdrop DRY_RUN monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: airdrop-dry-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Safety tests
        run: pytest -q
      - name: Official-source preflight and API/MCP probes
        run: python -m airdrop_agent.cli run --output-dir artifacts
      - name: Upload DRY_RUN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-dry-run-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
