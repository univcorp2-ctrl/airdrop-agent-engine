name: airdrop-agent-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit, contract, safety and public GET tests
        env:
          RUN_PUBLIC_GET_TESTS: '1'
        run: pytest -q
      - name: Doctor and config validation
        run: python -m airdrop_agent.cli doctor --json
      - name: Wave 1 DRY RUNs
        run: |
          python -m airdrop_agent.cli run --target pacifica --mode dry-run >/dev/null
          python -m airdrop_agent.cli run --target hibachi --mode dry-run >/dev/null
          python -m airdrop_agent.cli run --target kyan --mode dry-run >/dev/null
          python -m airdrop_agent.cli run --target lighter --mode dry-run >/dev/null
      - name: Run all safely
        run: python -m airdrop_agent.cli run-all --mode dry-run >/dev/null
      - name: Reports and dashboard render
        run: |
          python -m airdrop_agent.cli report --format markdown >/dev/null
          python -m airdrop_agent.cli dashboard --check
      - name: Assert no real dotenv file was committed
        run: test ! -f .env
